AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: madAuth webhook receiver that sends madAuth's e-mails with Amazon SES, and its SMS codes with Amazon SNS.

Parameters:
  WebhookKeysUrl:
    Type: String
    Default: ''
    AllowedPattern: '^(https://\S+)?$'
    ConstraintDescription: an https URL, e.g. https://example.com/.well-known/webhook-keys.json, or empty.
    Description: The madAuth server's <MADAUTH_ISSUER>/.well-known/webhook-keys.json (madAuth 0.7.5 or newer). Calls signed with its webhook key (v1a) are accepted, checked with these public keys alone; no secret is shared. Empty with MadauthRoleArn.
  WebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: The same WEBHOOK_SECRET as the madAuth server, for calls signed with it (v1), e.g. of a server without a webhook key. Next to WebhookKeysUrl while moving to it; empty with MadauthRoleArn.
  MadauthRoleArn:
    Type: String
    Default: ''
    # As the function checks it: IAM's characters in the path and the name.
    AllowedPattern: '^(arn:[\w-]+:iam::\d{12}:role/([\w+=,.@-]+/)*[\w+=,.@-]+)?$'
    ConstraintDescription: a role's ARN, e.g. arn:aws:iam::123456789012:role/madauth-server, or empty.
    Description: Instead of WebhookKeysUrl and WebhookSecret, for a madAuth server on AWS with WEBHOOK_AUTH=aws-iam in this account, the ARN of its role. The URL then has AWS_IAM auth and only this role's calls are accepted.
  MailFrom:
    Type: String
    Description: Sender, e.g. "Example" <no-reply@example.com>. Its domain must be verified in SES.
  SendingDomain:
    Type: String
    Description: The SES identity the e-mails are sent from, e.g. example.com.
  ConfigurationSet:
    Type: String
    Default: ''
    Description: Optional SES configuration set, e.g. to record bounces and complaints.
  SendSms:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Send madAuth's SMS codes (sms.send_code) with Amazon SNS. Needs SNS SMS set up in the region (see the README).
  SmsSenderId:
    Type: String
    Default: ''
    AllowedPattern: '^([A-Za-z0-9]{3,11})?$'
    ConstraintDescription: 3 to 11 letters and digits, or empty.
    Description: Optional sender name for the SMS, 3 to 11 letters and digits, where carriers show one (not in every country).

Conditions:
  HasConfigurationSet: !Not [!Equals [!Ref ConfigurationSet, '']]
  SendsSms: !Equals [!Ref SendSms, 'true']
  ChecksRole: !Not [!Equals [!Ref MadauthRoleArn, '']]
  ChecksSecret: !Not [!Condition ChecksRole]

Rules:
  OneCaller:
    Assertions:
      - Assert: !Not [!And [!Equals [!Ref WebhookKeysUrl, ''], !Equals [!Ref WebhookSecret, ''], !Equals [!Ref MadauthRoleArn, '']]]
        AssertDescription: Set WebhookKeysUrl (or WebhookSecret), or MadauthRoleArn for a madAuth server with WEBHOOK_AUTH=aws-iam.
      - Assert: !Or [!And [!Equals [!Ref WebhookKeysUrl, ''], !Equals [!Ref WebhookSecret, '']], !Equals [!Ref MadauthRoleArn, '']]
        AssertDescription: Set MadauthRoleArn alone, without WebhookKeysUrl and WebhookSecret. With MadauthRoleArn, AWS checks the caller and no signature is checked.

Resources:
  MailerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      # madAuth waits up to 10 seconds for an answer.
      Timeout: 8
      Environment:
        Variables:
          WEBHOOK_KEYS_URL: !Ref WebhookKeysUrl
          WEBHOOK_SECRET: !Ref WebhookSecret
          MADAUTH_ROLE_ARN: !Ref MadauthRoleArn
          MAIL_FROM: !Ref MailFrom
          SES_CONFIGURATION_SET: !Ref ConfigurationSet
          SEND_SMS: !Ref SendSms
          SMS_SENDER_ID: !Ref SmsSenderId
      Policies:
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource:
                - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SendingDomain}
                - !If
                  - HasConfigurationSet
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigurationSet}
                  - !Ref AWS::NoValue
            # Publishing to a phone number has no resource ARN, so SNS needs "*", and no condition key tells an SMS
            # from a topic (sns:Protocol only exists for Subscribe). The Deny keeps the function from publishing to
            # the account's topics: a phone-number Publish has no topic resource and is not matched by it.
            - !If
              - SendsSms
              - Effect: Allow
                Action: sns:Publish
                Resource: '*'
              - !Ref AWS::NoValue
            - !If
              - SendsSms
              - Effect: Deny
                Action: sns:Publish
                Resource: !Sub arn:${AWS::Partition}:sns:*:*:*
              - !Ref AWS::NoValue
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handler.ts]
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        # The AWS SDK is part of the Lambda runtime.
        External: ['@aws-sdk/*']
        Banner: ['js=import { createRequire } from "module"; const require = createRequire(import.meta.url);']

  # The URL madAuth calls. With MadauthRoleArn it has AWS_IAM auth: AWS refuses a call that isn't signed by a principal
  # allowed to invoke it before the function runs (madAuth's role gets that permission from its own policy, e.g. from
  # webhookFunctionArn of madAuth's AWS template), and the function accepts only that role. Without, it is public, and
  # the function checks every call's signature: v1a with the keys of WebhookKeysUrl, v1 with WebhookSecret.
  MailerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref MailerFunction
      AuthType: !If [ChecksRole, AWS_IAM, NONE]

  # A public URL needs both: Lambda checks lambda:InvokeFunctionUrl and lambda:InvokeFunction.
  MailerFunctionUrlPublicPermissions:
    Type: AWS::Lambda::Permission
    Condition: ChecksSecret
    Properties:
      FunctionName: !Ref MailerFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  MailerFunctionUrlPublicInvokePermissions:
    Type: AWS::Lambda::Permission
    Condition: ChecksSecret
    Metadata:
      # InvokedViaFunctionUrl (2025) is newer than the schema of the cfn-lint in some SAM CLIs.
      cfn-lint:
        config:
          ignore_checks: [E3002]
    Properties:
      FunctionName: !Ref MailerFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  WebhookUrl:
    Description: Set this as WEBHOOK_URL on the madAuth server.
    Value: !GetAtt MailerFunctionUrl.FunctionUrl
  FunctionArn:
    Description: With MadauthRoleArn, set this as webhookFunctionArn of madAuth's AWS template, so that madAuth's role may call the URL.
    Value: !GetAtt MailerFunction.Arn
